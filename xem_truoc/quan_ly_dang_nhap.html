<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản lý — Nhà Sách Tri Thức</title>
  <link rel="stylesheet" href="../static/css/giao_dien.css">
</head>
<body class="than-ql-dang-nhap">
  <main class="khung" style="padding-block: 48px;">
    <div class="khung-giua">
      <div style="text-align: center; margin-bottom: 20px;">
        <a href="/" class="logo" style="justify-content: center;">
          <span class="logo__bieu-tuong" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22V5.5Z"/>
              <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5A2.5 2.5 0 0 1 20 22V5.5Z"/>
            </svg>
          </span>
          <span class="logo__chu" style="text-align: left;">
            <span class="logo__ten">Tri Thức</span>
            <span class="logo__phu">Khu quản lý nhà sách</span>
          </span>
        </a>
      </div>

      
        
        
      

      <section class="the-xac-thuc" aria-labelledby="tieu-de-ql-dn">
        <div class="the-xac-thuc__dau">
          <div class="the-xac-thuc__icon" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 id="tieu-de-ql-dn" class="tieu-de-trang" style="font-size: 1.5rem;">Đăng nhập quản lý</h1>
          <p class="phu-de-trang">Nhập mật khẩu quản trị để truy cập bảng điều khiển nhà sách.</p>
        </div>

        <form method="post" action="/quan-ly/dang-nhap" data-dang-xu-ly>
          <input type="hidden" name="csrf" value="xem-truoc-csrf-token">

          <div class="truong" style="margin-bottom: 20px;">
            <label class="truong__nhan" for="ql-mat-khau">Mật khẩu quản lý <span class="truong__bat-buoc">*</span></label>
            <input id="ql-mat-khau" class="o-nhap" type="password" name="mat_khau" required autofocus autocomplete="current-password"
                   placeholder="Nhập mật khẩu quản trị">
          </div>

          <button type="submit" class="nut nut--chinh nut--lon nut--rong" data-nhan-xu-ly="Đang xử lý…">Vào trang quản lý</button>
        </form>

        <div class="the-xac-thuc__chan">
          <a href="/">&larr; Quay lại trang cửa hàng</a>
        </div>
      </section>
    </div>
  </main>
  <script src="../static/js/bieu_mau.js" defer></script>
</body>
</html>
